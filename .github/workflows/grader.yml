name: Autograding Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-matrix-tests:
    name: Execute Engineering Matrix Simulation Autograder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Student Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Matrix Simulation Unit Tests
        run: |
          python3 matrix_engineering_simulation.py --test
